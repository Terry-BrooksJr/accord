# A generic, single database configuration.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../..
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
path_separator = os
sqlalchemy.url = postgresql://DUMMYSTRING_REPLACED_IN_ALEMBIC.PY


[post_write_hooks]
hooks = black, ruff
black.type = console_scripts
black.entrypoint = black
ruff.type = module
ruff.module = ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
