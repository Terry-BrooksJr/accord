global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The webhook gateway runs inside the dev container's app service.
  - job_name: webhook-gateway
    metrics_path: /gateway/metrics
    static_configs:
      - targets: ["app:8080"]

  # Extra targets can be dropped into targets/ as file_sd JSON or YAML.
  - job_name: file-targets
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yaml
          - /etc/prometheus/targets/*.json
