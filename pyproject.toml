[project]
name = "accord"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Terry Brooks Jr", email = "Terry.Arthur@BrooksJr.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "black>=26.10.1",
    "dotenv>=0.9.9",
    "psycopg>=3.3.8",
    "sqlmodel>=0.0.48",
]

[project.scripts]
accord = "accord:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-root = "services"


[tool.ruff]
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
]

fixable = ["ALL"]
unfixable = []

[dependency-groups]
dev = [
    "isort>=9.0.2",
]

